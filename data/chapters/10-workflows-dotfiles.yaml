id: "10-workflows-dotfiles"
title: "Git essentiel"
description: "Git, outil CLI de gestion de versions, dans un dépôt simulé. L’identifiant historique du chapitre est conservé pour protéger les acquis ; aucun workflow personnel de dotfiles ne reste actif."
family: "unix-shell"
learning_order: "independent"
items:
  - id: "dotfiles-status-shell"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "beginner"
    tools: ["git"]
    prompt: |-
      Situation indépendante : tu es à la racine d’un dépôt Git. Affiche son
      état en format court avec la commande Git complète et l’option --short
      ou sa forme courte.
    answer:
      primary: "git status --short"
      accepted: ["git status -s"]
    explanation: |-
      git status --short résume l’état de l’index, de l’arbre de
      travail et des fichiers non suivis. Les deux colonnes
      décrivent l’index et l’arbre de travail ; cela ne crée aucun
      commit.
  - id: "git-diff-stat"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "beginner"
    tools: ["git"]
    prompt: |-
      Situation indépendante : dans un dépôt Git, un fichier suivi comporte
      des modifications non indexées. Affiche un résumé chiffré du diff avec
      git diff et --stat.
    answer:
      primary: "git diff --stat"
    explanation: |-
      --stat affiche les fichiers et les volumes de lignes
      modifiées. Sans --cached, git diff compare l’arbre de
      travail à l’index ; il ne décrit pas les fichiers non
      suivis.
  - id: "git-diff-name-only"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "beginner"
    tools: ["git"]
    prompt: |-
      Situation indépendante : dans un dépôt Git, des fichiers suivis ont
      été modifiés sans être indexés. Avec git diff et --name-only, affiche
      seulement leurs noms.
    answer:
      primary: "git diff --name-only"
    explanation: |-
      --name-only affiche les noms des fichiers différents entre
      l’arbre de travail et l’index dans ce cas. Les modifications
      déjà indexées demanderaient --cached.
