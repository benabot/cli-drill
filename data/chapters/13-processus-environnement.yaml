id: "13-processus-environnement"
title: "Processus et environnement"
description: "Processus par PID et portée des variables du shell."
family: "unix-shell"
learning_order: "independent"
items:
  - id: "show-environment-variable"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "beginner"
    tools: []
    prompt: |-
      LANG est exportée. Affiche uniquement sa valeur avec l’outil
      de consultation de l’environnement.
    answer:
      primary: "printenv LANG"
    explanation: |-
      Avec un nom, printenv affiche la valeur de cette variable
      exportée. Sans nom, il affiche tout l’environnement.
      Cet outil est commun à BSD et GNU, hors norme POSIX.
  - id: "set-shell-variable"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "beginner"
    tools: []
    prompt: |-
      ATELIER_MODE n’existe pas. Donne-lui la valeur test dans le shell
      courant, sans la transmettre aux programmes qu’il lance.
    answer:
      primary: "ATELIER_MODE=test"
      accepted: ["ATELIER_MODE='test'", 'ATELIER_MODE="test"']
    explanation: |-
      Une affectation seule crée cette variable dans le shell.
      Il ne doit pas y avoir d’espace autour de =. Une variable
      nouvellement créée est normalement non exportée.
  - id: "inspect-pid"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "intermediate"
    tools: []
    prompt: |-
      Affiche un instantané du seul processus dont le PID est 4242,
      avec les colonnes par défaut.
    answer:
      primary: "ps -p 4242"
    explanation: |-
      -p sélectionne le processus par son identifiant numérique.
      ps affiche un instantané. Un processus terminé disparaît
      de la liste et son PID peut être réutilisé plus tard.
  - id: "request-termination"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "intermediate"
    tools: []
    prompt: |-
      Le PID 4242 désigne un processus à toi. Envoie-lui explicitement
      le signal qui demande un arrêt propre, sans le forcer.
    answer:
      primary: "kill -s TERM 4242"
      accepted: ["kill -TERM 4242"]
    explanation: |-
      TERM demande l’arrêt et laisse le processus traiter le
      signal s’il a prévu un nettoyage. Il peut l’ignorer.
      Vérifie le PID avant de signaler un processus réel.
  - id: "export-variable"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "intermediate"
    tools: []
    prompt: |-
      Donne la valeur test à ATELIER_MODE et rends-la accessible
      à tous les futurs programmes lancés depuis ce shell.
    answer:
      primary: "export ATELIER_MODE=test"
      accepted: ["export ATELIER_MODE='test'", 'export ATELIER_MODE="test"']
    explanation: |-
      export affecte la valeur et marque la variable pour qu’elle
      soit transmise aux nouveaux processus enfants. Ceux qui
      tournent déjà gardent leur propre environnement.
  - id: "one-command-environment"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "intermediate"
    tools: []
    prompt: |-
      Trie les lignes de noms.txt avec LC_ALL à C pour ce seul appel.
      Laisse la locale du shell et des appels suivants intacte.
    answer:
      primary: "LC_ALL=C sort noms.txt"
      accepted: ["env LC_ALL=C sort noms.txt"]
    explanation: |-
      Devant une commande externe, l’affectation s’applique à
      cette exécution. env peut aussi définir la variable pour
      ce seul lancement. LC_ALL=C impose l’ordre de la locale C.
  - id: "ps-terminal-processes"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "beginner"
    tools: []
    prompt: |-
      Sur macOS, l’entrée standard est le terminal de ta session.
      Affiche la liste des processus attachés à ce terminal, avec
      les colonnes habituelles.
    answer:
      primary: "ps -T"
    explanation: |-
      Sur macOS, -T sélectionne les processus associés au terminal
      de l’entrée standard. -A élargirait à toute la machine.
  - id: "read-process-id"
    type: "concept"
    exercise_type: "free-answer"
    difficulty: "beginner"
    tools: []
    prompt: |-
      Quel est le PID du processus rendu dans ce relevé ?

      PID   PPID  COMMAND
      3082  3079  rendu
    answer:
      primary: "3082"
    explanation: |-
      PID identifie le processus affiché. PPID est l’identifiant
      de son parent, ici 3079.
  - id: "list-exported-environment"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "beginner"
    tools: []
    prompt: |-
      Affiche l’ensemble de l’environnement exporté sous la forme
      NOM=valeur, sans changer les variables ni lancer de commande
      avec cet environnement.
    answer:
      primary: "env"
      accepted:
        - "printenv"
    explanation: |-
      Sans autre opérande, env affiche l’environnement reçu.
      Il n’inclut pas les variables internes non exportées.
  - id: "unset-shell-variable"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "beginner"
    tools: []
    prompt: |-
      Dans Bash, ATELIER_CACHE est une variable modifiable.
      Retire-la du shell courant : elle doit devenir absente,
      pas seulement vide.
    answer:
      primary: "unset ATELIER_CACHE"
      accepted:
        - "unset -v ATELIER_CACHE"
    explanation: |-
      unset retire la variable. L’affecter à une chaîne vide
      laisserait son nom défini.
  - id: "list-shell-jobs"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "beginner"
    tools: []
    prompt: |-
      Dans un Bash interactif, affiche les tâches que ce shell
      gère, au format habituel, avec leurs états.
    answer:
      primary: "jobs"
    explanation: |-
      jobs montre les travaux gérés par ce shell, avec leurs
      numéros et leurs états. Ce n’est pas un inventaire général
      des processus.
  - id: "launch-background-job"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "beginner"
    tools: []
    prompt: |-
      Dans un shell interactif, lance la commande fictive
      « rendu apercu » en arrière-plan pour récupérer l’invite
      sans attendre la fin de la commande.
    answer:
      primary: "rendu apercu &"
      accepted:
        - "rendu apercu&"
    explanation: |-
      L’opérateur & lance la commande de façon asynchrone.
      Le shell rend l’invite sans attendre sa fin.
  - id: "foreground-known-job"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "beginner"
    tools: []
    prompt: |-
      Dans Bash avec contrôle des jobs, le job numéro 2 tourne
      en arrière-plan. Ramène précisément ce job au premier plan.
    answer:
      primary: "fg %2"
    explanation: |-
      fg place le job au premier plan. %2 est un numéro de job
      connu du shell, pas un PID.
  - id: "empty-exported-variable"
    type: "concept"
    exercise_type: "multiple-choice"
    difficulty: "beginner"
    tools: []
    prompt: |-
      Dans la liste de l’environnement exporté, une ligne vaut
      « FILTRE= ». Quel est l’état de FILTRE ?
    choices:
      - "Absente de l’environnement."
      - "Définie et non exportée."
      - "Définie et vide."
    answer:
      primary: "Définie et vide."
    explanation: |-
      Le signe = sépare le nom de sa valeur. Ici la variable est
      présente et exportée, avec une valeur de longueur zéro.
  - id: "ps-pid-parent-columns"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "intermediate"
    tools: []
    prompt: |-
      Affiche uniquement le PID et le PID parent, dans cet ordre
      avec les en-têtes usuels, pour le processus 5810 seul.
    answer:
      primary: "ps -p 5810 -o pid,ppid"
      accepted:
        - "ps -o pid,ppid -p 5810"
        - "ps -p 5810 -o pid -o ppid"
        - "ps -o pid -o ppid -p 5810"
        - "ps -p 5810 -o \"pid,ppid\""
    explanation: |-
      -p sélectionne le processus. Les champs demandés avec -o
      fixent les colonnes et leur ordre : pid, puis ppid.
  - id: "last-background-pid"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "intermediate"
    tools: []
    prompt: |-
      Dans Bash, une commande simple vient d’être lancée en
      arrière-plan. Affiche seulement son PID à partir du
      paramètre spécial, avant tout autre lancement en arrière-plan.
    answer:
      primary: "printf '%s\\n' \"$!\""
      accepted:
        - "printf \"%s\\n\" \"$!\""
        - "echo \"$!\""
        - "echo $!"
    explanation: |-
      $! désigne le PID du dernier lancement en arrière-plan.
      $$ désigne le PID du shell appelant dans ce contexte.
  - id: "wait-specific-child"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "intermediate"
    tools: []
    prompt: |-
      Deux commandes sont en arrière-plan dans ce shell. Leurs
      PID sont 5814 et 5816. Attends seulement la fin de 5814.
    answer:
      primary: "wait 5814"
    explanation: |-
      Avec le PID, wait attend cet enfant du shell. Sans
      argument, il attend l’ensemble des travaux en arrière-plan.
  - id: "resume-suspended-in-background"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "intermediate"
    tools: []
    prompt: |-
      Dans Bash avec contrôle des jobs, le job 4 est suspendu.
      Reprends son exécution sans le ramener au premier plan.
    answer:
      primary: "bg %4"
    explanation: |-
      bg reprend le job indiqué en arrière-plan. Avec fg, il
      repartirait au premier plan.
  - id: "wait-child-exit-status"
    type: "concept"
    exercise_type: "multiple-choice"
    difficulty: "intermediate"
    tools: []
    prompt: |-
      Le shell attend un seul de ses enfants identifié par PID.
      Cet enfant se termine de lui-même, sans signal. La commande
      d’attente renvoie 7. Que représente ce 7 ?
    choices:
      - "Le numéro du signal reçu par l’enfant."
      - "Le code de sortie de l’enfant."
      - "Le rang de l’enfant parmi les jobs."
    answer:
      primary: "Le code de sortie de l’enfant."
    explanation: |-
      Pour cet enfant terminé normalement, wait renvoie son code
      de sortie. Il ne donne ni son PID ni un numéro de signal.
  - id: "launch-with-clean-environment"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "intermediate"
    tools: []
    prompt: |-
      Lance /atelier/bin/analyse avec un environnement de départ
      qui ne contient que LC_ALL=C et MODE=essai. Ne modifie pas
      l’environnement du shell courant.
    answer:
      primary: "env -i LC_ALL=C MODE=essai /atelier/bin/analyse"
      accepted:
        - "env -i MODE=essai LC_ALL=C /atelier/bin/analyse"
    explanation: |-
      -i part d’un environnement vide, puis env ajoute les deux
      valeurs fournies. Le chemin absolu évite toute recherche
      dans PATH pour lancer le programme.
  - id: "identify-job-process-group"
    type: "concept"
    exercise_type: "multiple-choice"
    difficulty: "advanced"
    tools: []
    prompt: |-
      Dans Bash, le job 3 est un pipeline. Relevé PID / PGID :
      4101 / 4101 ; 4102 / 4101.
      Sans utiliser la table des jobs, quelle cible permet de
      signaler les deux maillons ensemble ?
    choices:
      - "Le PID 4102."
      - "Le PID 4101."
      - "Le groupe de processus 4101."
    answer:
      primary: "Le groupe de processus 4101."
    explanation: |-
      Les deux maillons partagent le groupe 4101. Viser un PID
      seul ne signale qu’un processus ; 3 est un numéro propre
      à la table des jobs du shell.
  - id: "signal-service-cleanup"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "advanced"
    tools: []
    prompt: |-
      Le service au PID 5174 ignore le signal d’arrêt
      ordinaire. Sa documentation réserve le premier signal
      utilisateur au vidage de la file, au retrait du verrou puis
      à l’arrêt. Envoie ce signal.
    answer:
      primary: "kill -s USR1 5174"
      accepted:
        - "kill -USR1 5174"
    explanation: |-
      Ce service intercepte USR1 pour sa procédure de nettoyage.
      C’est son propre contrat. KILL ne peut pas être intercepté
      et ne permet pas au service de terminer ce travail.
  - id: "background-terminal-read-stop"
    type: "concept"
    exercise_type: "free-answer"
    difficulty: "advanced"
    tools: []
    prompt: |-
      Dans Bash interactif avec contrôle des jobs, un job non
      orphelin tente de lire son terminal en arrière-plan. Les
      signaux gardent leur action par défaut et ne sont pas
      bloqués. Quel signal suspend ce job ?
    answer:
      primary: "SIGTTIN"
      accepted:
        - "TTIN"
    explanation: |-
      Le pilote du terminal envoie SIGTTIN au groupe en
      arrière-plan qui tente de lire. Le job est suspendu ;
      il n’est pas terminé.
  - id: "path-change-clears-cache"
    type: "concept"
    exercise_type: "multiple-choice"
    difficulty: "advanced"
    tools: []
    prompt: |-
      Dans Bash, lire lançait /atelier/bin/lire, dont le chemin
      était en cache. Aucun alias ni fonction ne porte ce nom,
      et ce fichier est le seul exécutable lire. Après avoir
      remplacé PATH par /usr/bin:/bin, pourquoi lire échoue-t-il ?
    choices:
      - "Bash réutilise toujours le chemin mémorisé."
      - "Bash a vidé son cache et le dossier a quitté PATH."
      - "Changer PATH retire le droit d’exécution au fichier."
    answer:
      primary: "Bash a vidé son cache et le dossier a quitté PATH."
    explanation: |-
      Affecter PATH vide la table des chemins mémorisés. La
      nouvelle recherche ne passe plus par /atelier/bin, même
      si le fichier y est toujours présent et exécutable.
  - id: "export-after-child-launch"
    type: "concept"
    exercise_type: "free-answer"
    difficulty: "advanced"
    tools: []
    prompt: |-
      Le shell exporte MODE=avant et lance A. Il exporte ensuite
      MODE=apres et lance B. Les deux enfants consultent MODE
      après le lancement de B, sans modifier leur environnement.
      Quelles valeurs lisent-ils, A puis B, séparées par un espace ?
    answer:
      primary: "avant apres"
    explanation: |-
      Chaque enfant reçoit les valeurs exportées au lancement.
      L’export ultérieur change l’environnement transmis à B,
      pas celui qu’A a déjà reçu.
  - id: "subshell-variable-isolation"
    type: "concept"
    exercise_type: "multiple-choice"
    difficulty: "advanced"
    tools: []
    prompt: |-
      Dans Bash, COULEUR vaut bleu. Le shell lance un groupe entre
      parenthèses qui la change en vert et l’exporte. Pourquoi
      COULEUR vaut-elle encore bleu dans le shell appelant ?
    choices:
      - "Le groupe modifie une copie de la variable."
      - "L’export propage la valeur du groupe au parent."
      - "Le changement échoue parce que la variable existait."
    answer:
      primary: "Le groupe modifie une copie de la variable."
    explanation: |-
      Les parenthèses exécutent le groupe dans un sous-shell.
      L’export y concerne ses propres futurs enfants ; il ne
      remonte pas vers le shell appelant.
  - id: "load-script-current-shell"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "advanced"
    tools: []
    prompt: |-
      Dans Bash, le script lisible et exécutable profil.sh se trouve
      dans le répertoire courant. Charge-le pour garder dans ton
      shell la variable que le script définit.
    answer:
      primary: ". ./profil.sh"
      accepted:
        - "source ./profil.sh"
    explanation: |-
      Le point et source exécutent le fichier dans le shell
      courant. Un lancement séparé ne peut pas y laisser les
      variables que le script définit.
  - id: "cwd-with-empty-environment"
    type: "concept"
    exercise_type: "free-answer"
    difficulty: "advanced"
    tools: []
    prompt: |-
      Le shell se trouve dans /atelier, puis entre dans sorties.
      Sans lien symbolique, il lance /bin/pwd en mode physique avec
      un environnement totalement vide, sans PWD. Quel chemin la
      commande affiche-t-elle ?
    answer:
      primary: "/atelier/sorties"
    explanation: |-
      Le processus conserve le répertoire courant comme attribut
      système, indépendamment des variables. Le mode physique
      de pwd peut donc afficher /atelier/sorties sans PWD.
  - id: "read-zombie-process-state"
    type: "concept"
    exercise_type: "multiple-choice"
    difficulty: "advanced"
    tools: []
    prompt: |-
      Sur macOS, un relevé indique l’état Z pour un enfant dont
      le PID est toujours présent. Que peut encore faire son
      processus parent au sujet de cet enfant ?
    choices:
      - "Le reprendre au premier plan."
      - "Récupérer son statut de fin."
      - "Le réveiller avec un signal de continuation."
    answer:
      primary: "Récupérer son statut de fin."
    explanation: |-
      Un zombie a terminé : il ne peut plus s’exécuter. Le
      parent peut encore récupérer son statut de fin ; jusque-là,
      le système conserve son entrée.
  - id: "trap-scope-subshell"
    type: "concept"
    exercise_type: "multiple-choice"
    difficulty: "advanced"
    tools: []
    prompt: |-
      Dans Bash, le shell parent installe un gestionnaire pour
      USR1, puis lance un groupe entre parenthèses. Le groupe
      n’installe aucun gestionnaire ; USR1 n’était ni ignoré ni
      bloqué. Seul le sous-shell reçoit USR1. Quel est l’effet ?
    choices:
      - "Le sous-shell exécute le gestionnaire du parent."
      - "Le sous-shell s’arrête sans lancer le gestionnaire."
      - "Le sous-shell ignore le signal."
    answer:
      primary: "Le sous-shell s’arrête sans lancer le gestionnaire."
    explanation: |-
      Dans le sous-shell, le signal piégé par le parent retrouve
      son action héritée au démarrage de Bash. Ici l’action par
      défaut de USR1 est l’arrêt, sans exécuter le gestionnaire.
  - id: "run-executable-relative-path"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "beginner"
    tools: []
    prompt: |-
      Le programme exécutable releve est dans le dossier courant,
      que PATH ne contient pas. Lance ce fichier par un chemin
      relatif, sans modifier PATH.
    answer:
      primary: "./releve"
      accepted:
        - "'./releve'"
        - "\"./releve\""
    explanation: |-
      Avec ./, tu donnes un chemin depuis le dossier courant.
      Un nom qui contient / évite la recherche dans PATH.
  - id: "path-prepend-for-one-call"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "intermediate"
    tools: []
    prompt: |-
      analyse est un exécutable qui existe aussi dans
      /opt/test/bin. Lance-le par son nom en donnant la
      priorité à ce dossier pour ce seul appel. Garde les
      autres entrées de PATH. Aucun alias ni fonction ne
      s’appelle analyse et PATH est déjà renseigné.
    answer:
      primary: "PATH=\"/opt/test/bin:$PATH\" analyse"
      accepted:
        - "PATH=/opt/test/bin:\"$PATH\" analyse"
        - "env PATH=\"/opt/test/bin:$PATH\" analyse"
    explanation: |-
      Le dossier ajouté en tête est cherché en premier.
      L’affectation devant cette commande externe vaut pour
      un seul appel. Les entrées déjà présentes restent
      disponibles après le dossier de test.
  - id: "find-process-by-exact-name"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "intermediate"
    tools: []
    prompt: |-
      Sur macOS, FreeBSD ou Linux avec procps, affiche les PID
      des processus dont le nom court est exactement agentweb.
      La machine exécute aussi agentweb-test. Ne leur envoie
      aucun signal.
    answer:
      primary: "pgrep -x agentweb"
      accepted:
        - "pgrep -x 'agentweb'"
        - "pgrep '^agentweb$'"
    explanation: |-
      pgrep affiche les PID trouvés. -x impose une
      correspondance sur le nom entier, comme les ancres
      ^ et $. agentweb-test ne correspond donc pas.
  - id: "read-job-control-stop-state"
    type: "concept"
    exercise_type: "free-answer"
    difficulty: "intermediate"
    tools: []
    prompt: |-
      Voici deux lignes d’un relevé ps de procps sous Linux.
      Quel PID a été arrêté par un signal de contrôle de tâches ?

      PID   STAT  COMMAND
      4812  T     agentweb
      4813  S     agentweb-test
    answer:
      primary: "4812"
    explanation: |-
      Dans STAT, T indique un arrêt par un signal de contrôle
      de tâches. S indique une attente interruptible.
  - id: "diagnose-command-launch-status"
    type: "concept"
    exercise_type: "free-answer"
    difficulty: "intermediate"
    tools: []
    prompt: |-
      Dans un shell POSIX, le premier appel échoue car le nom
      demandé est introuvable. Le second trouve le fichier
      voulu mais ne peut pas le lancer faute de droit
      d’exécution. Donne les deux statuts dans l’ordre.
    answer:
      primary: "127 126"
      accepted:
        - "127, 126"
        - "127,126"
    explanation: |-
      127 signifie que le shell n’a pas trouvé la commande.
      126 signifie qu’il l’a trouvée mais ne peut pas
      l’exécuter.
  - id: "force-stop-verified-pid"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "advanced"
    tools: []
    prompt: |-
      Le délai d’arrêt après TERM est écoulé. Un relevé
      récent confirme que 4821 est toujours le PID du
      service de test visé. L’arrêt forcé est autorisé.
      Envoie le signal à ce seul PID par son nom symbolique.
    answer:
      primary: "kill -s KILL 4821"
      accepted:
        - "kill -s 'KILL' 4821"
        - "kill -KILL 4821"
    explanation: |-
      KILL ne peut être intercepté ni ignoré. Le processus
      ne peut donc pas exécuter son nettoyage. Ici, TERM a
      déjà été tenté et le PID a été vérifié avant l’arrêt
      forcé.
  - id: "jobs-with-process-ids"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "intermediate"
    tools: []
    prompt: |-
      Dans le shell interactif qui a lancé plusieurs tâches, affiche leurs
      numéros de job avec leurs PID.
    answer:
      primary: "jobs -l"
    explanation: |-
      L’option -l ajoute les PID à l’affichage des tâches connues
      de ce shell.
  - id: "env-client-without-proxy"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "intermediate"
    tools: []
    prompt: |-
      Avec env GNU ou natif sur macOS, lance le programme externe client
      avec HTTP_PROXY absente pour cet appel. Garde les autres variables
      et le réglage du shell courant.
    answer:
      primary: "env -u HTTP_PROXY client"
    explanation: |-
      env -u retire la variable de l’environnement de client. Une
      affectation vide la laisse présente.
  - id: "kill-zero-observation"
    type: "concept"
    exercise_type: "multiple-choice"
    difficulty: "advanced"
    tools: []
    prompt: |-
      kill -s 0 4172 réussit. Que peux-tu conclure au moment précis de ce
