  - id: "nohup-background-collect"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "advanced"
    tools: []
    prompt: |-
      Lance la commande externe collecte en arrière-plan. Donne-lui une
      entrée vide depuis /dev/null, écris les deux flux dans collecte.log
      et fais ignorer SIGHUP. Le programme conserve ce réglage.
    answer:
      primary: "nohup collecte </dev/null >collecte.log 2>&1 &"
      accepted: ["nohup collecte > collecte.log 2>&1 < /dev/null &"]
    explanation: |-
      nohup fait ignorer SIGHUP. Les redirections détachent
      l’entrée et réunissent les sorties. & lance le travail en
      arrière-plan.
