id: "07-lecture-preview"
title: "Lire un fichier avec Bat"
description: "Module tiers Bat : lire un fichier texte local simulé. Bat peut utiliser un pager selon la sortie et sa configuration ; aucun programme tiers n’est lancé par CLI-Drill."
family: "modern-cli-macos"
learning_order: "independent"
items:
  - id: "bat-readme"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "beginner"
    tools: ["bat"]
    prompt: |-
      Situation indépendante : README.md est un fichier texte du répertoire
      courant. Affiche-le avec bat, sans option.
    answer:
      primary: "bat README.md"
    explanation: |-
      bat affiche le fichier avec coloration syntaxique et peut
      utiliser un pager. La casse de README.md fait partie du nom
      fourni ; bat readme.md désignerait potentiellement un autre
      fichier.
