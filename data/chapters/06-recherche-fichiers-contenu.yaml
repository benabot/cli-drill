id: "06-recherche-fichiers-contenu"
title: "Rechercher et sélectionner"
description: "Outils tiers fd, ripgrep et fzf. Recherche limitée aux fichiers textuels ordinaires du projet simulé ; les exclusions par défaut sont précisées."
family: "modern-cli-macos"
learning_order: "independent"
items:
  - id: "rg-content"
    type: "tool"
    exercise_type: "multiple-choice"
    difficulty: "beginner"
    tools: ["rg"]
    prompt: |-
      Tu connais le texte TODO mais pas le fichier qui le contient. Quel
      outil de cette liste recherche dans le contenu des fichiers ?
    choices: ["fd", "rg", "eza", "bat"]
    answer:
      primary: "rg"
      accepted: ["ripgrep"]
    explanation: |-
      rg (ripgrep) recherche un motif dans les fichiers. Sans
      chemin explicite, il parcourt le dossier courant ; il ignore
      par défaut les fichiers cachés, exclus et binaires.
  - id: "fd-notes-command"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "beginner"
    tools: ["fd"]
    prompt: |-
      Situation simulée : le projet contient notes.txt et notes.md. Avec fd
      et le motif notes, recherche les chemins dont le nom correspond à ce
      motif.
    answer:
      primary: "fd notes"
    explanation: |-
      fd applique par défaut son motif au nom de chaque chemin,
      pas à son contenu. Le motif est une expression régulière ;
      notes ne nécessite ici aucun caractère spécial.
  - id: "fd-fzf-md"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "intermediate"
    tools: ["fd", "fzf"]
    prompt: |-
      Situation simulée : les seules entrées portant l’extension md sont des
      fichiers Markdown, sans retour à la ligne dans leurs noms. Utilise fd
      -e md puis fzf pour choisir un chemin parmi les résultats.
    answer:
      primary: "fd -e md | fzf"
    explanation: |-
      -e md filtre par extension, sans le point. Le pipe transmet
      les chemins à fzf ; choisir un résultat ne le lit pas et ne
      lance aucun éditeur.
  - id: "rg-fzf-todo"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "intermediate"
    tools: ["rg", "fzf"]
    prompt: |-
      Situation simulée : les fichiers texte du projet contiennent des TODO.
      Utilise rg TODO puis fzf pour choisir une ligne de résultat.
    answer:
      primary: "rg TODO | fzf"
      accepted: ["rg \"TODO\" | fzf"]
    explanation: |-
      rg cherche le motif TODO en respectant ici la casse. fzf
      filtre ses lignes de sortie ; celles-ci peuvent inclure
      chemin et numéro de ligne. Ce pipeline n’ouvre aucun
      fichier.
  - id: "rg-fzf-docs"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "intermediate"
    tools: ["rg", "fzf"]
    prompt: |-
      Situation simulée : le dossier docs contient des fichiers texte.
      Recherche cli-drill dans docs avec rg, puis sélectionne une ligne avec
      fzf. Ne demande pas d’ouverture de fichier.
    answer:
      primary: "rg cli-drill docs | fzf"
      accepted: ["rg \"cli-drill\" docs | fzf"]
    explanation: |-
      docs borne la recherche. fzf sélectionne une ligne produite
      par rg ; cette commande ne lance pas Bat et ne promet aucune
      prévisualisation.
