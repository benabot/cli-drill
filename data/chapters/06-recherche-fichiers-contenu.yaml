id: "06-recherche-fichiers-contenu"
title: "Rechercher et sélectionner"
description: "Outils tiers fd, ripgrep et fzf. Recherche limitée aux fichiers textuels ordinaires du projet simulé ; les exclusions par défaut sont précisées."
family: "modern-cli-macos"
learning_order: "independent"
items:
  - id: "rg-content"
    type: "tool"
    exercise_type: "multiple-choice"
    difficulty: "beginner"
    tools: ["rg"]
    prompt: |-
      Tu connais le texte TODO mais pas le fichier qui le contient. Quel
      outil de cette liste recherche dans le contenu des fichiers ?
    choices: ["fd", "rg", "eza", "bat"]
    answer:
      primary: "rg"
      accepted: ["ripgrep"]
    explanation: |-
      rg (ripgrep) recherche un motif dans les fichiers. Sans
      chemin explicite, il parcourt le dossier courant ; il ignore
      par défaut les fichiers cachés, exclus et binaires.
  - id: "fd-notes-command"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "beginner"
    tools: ["fd"]
    prompt: |-
      Recherche dans le projet les chemins dont le nom contient notes
      avec l’outil tiers de recherche par nom.
    answer:
      primary: "fd notes"
    explanation: |-
      fd applique par défaut son motif au nom de chaque chemin,
      pas à son contenu. Le motif est une expression régulière ;
      notes ne nécessite ici aucun caractère spécial.
  - id: "fd-fzf-md"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "intermediate"
    tools: ["fd", "fzf"]
    prompt: |-
      Les seules entrées .md du projet sont des fichiers, sans saut de
      ligne dans leurs noms. Filtre les chemins par extension, puis
      choisis-en un interactivement dans le même pipeline.
    answer:
      primary: "fd -e md | fzf"
    explanation: |-
      -e md filtre par extension, sans le point. Le pipe transmet
      les chemins à fzf ; choisir un résultat ne le lit pas et ne
      lance aucun éditeur.
  - id: "rg-fzf-todo"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "intermediate"
    tools: ["rg", "fzf"]
    prompt: |-
      Trouve les lignes du projet contenant TODO en majuscules, puis
      sélectionne une ligne interactivement dans le même pipeline.
    answer:
      primary: "rg TODO | fzf"
      accepted: ["rg \"TODO\" | fzf"]
    explanation: |-
      rg cherche le motif TODO en respectant ici la casse. fzf
      filtre ses lignes de sortie ; celles-ci peuvent inclure
      chemin et numéro de ligne. Ce pipeline n’ouvre aucun
      fichier.
  - id: "rg-fzf-docs"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "intermediate"
    tools: ["rg", "fzf"]
    prompt: |-
      Cherche cli-drill dans les fichiers texte de docs et sélectionne
      une ligne interactivement dans le même pipeline.
    answer:
      primary: "rg cli-drill docs | fzf"
      accepted: ["rg \"cli-drill\" docs | fzf"]
    explanation: |-
      docs borne la recherche de rg à ce dossier. fzf affiche la
      ligne sélectionnée, avec le chemin fourni par la recherche.
  - id: "rg-numbered"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "intermediate"
    tools: ["rg"]
    prompt: |-
      Avec ripgrep, cherche TODO dans docs et affiche le numéro
      de chaque ligne correspondante, même en sortie redirigée.
    answer:
      primary: "rg -n TODO docs"
      accepted: ["rg --line-number TODO docs"]
    explanation: |-
      -n ajoute le numéro de ligne aux résultats. Les fichiers
      cachés ou ignorés restent exclus par défaut.
  - id: "rg-matching-files"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "intermediate"
    tools: ["rg"]
    prompt: |-
      Avec ripgrep, affiche seulement les chemins des fichiers de
      docs contenant TODO, sans afficher leurs lignes.
    answer:
      primary: "rg -l TODO docs"
      accepted: ["rg --files-with-matches TODO docs"]
    explanation: |-
      -l affiche une fois chaque chemin contenant une
      correspondance, sans imprimer le contenu trouvé.
  - id: "rg-fixed-dot"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "intermediate"
    tools: ["rg"]
    prompt: |-
      Avec ripgrep, cherche la chaîne littérale v1.2 dans
      notes.txt, sans interpréter le point comme un motif.
    answer:
      primary: "rg -F 'v1.2' notes.txt"
      accepted: ['rg -F "v1.2" notes.txt', "rg -F v1.2 notes.txt"]
    explanation: |-
      -F traite le motif comme du texte littéral. Sans cette
      option, le point représente un caractère quelconque.
  - id: "rg-go-glob"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "intermediate"
    tools: ["rg"]
    prompt: |-
      Avec ripgrep, cherche TODO dans les fichiers du projet
      dont le nom se termine par .go.
    answer:
      primary: "rg -g '*.go' TODO"
      accepted: ['rg -g "*.go" TODO', "rg --glob '*.go' TODO"]
    explanation: |-
      -g filtre les chemins avec un glob. Les guillemets
      empêchent le shell de développer le motif avant rg.
  - id: "fd-go-files"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "intermediate"
    tools: ["fd"]
    prompt: |-
      Avec fd, trouve les fichiers ordinaires du projet ayant
      l’extension go, sans inclure les dossiers.
    answer:
      primary: "fd -t f -e go"
      accepted: ["fd --type f --extension go"]
    explanation: |-
      -t f restreint aux fichiers et -e go filtre l’extension.
      Les chemins cachés et ignorés restent exclus par défaut.
  - id: "fd-hidden-notes"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "intermediate"
    tools: ["fd"]
    prompt: |-
      Avec fd, trouve les fichiers dont le nom contient notes,
      y compris les cachés, en respectant les exclusions.
    answer:
      primary: "fd -H -t f notes"
      accepted: ["fd --hidden --type f notes"]
    explanation: |-
      -H inclut les chemins cachés et -t f limite aux fichiers.
      Les règles d’exclusion restent appliquées.
  - id: "rg-files-select"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "advanced"
    tools: ["rg", "fzf", "bat"]
    prompt: |-
      Choisis un fichier de docs contenant TODO et affiche-le avec
      bat en une commande. La sélection est confirmée. Les chemins
      peuvent contenir des espaces, sans tiret initial ni saut de ligne.
    answer:
      primary: 'bat "$(rg -l TODO docs | fzf)"'
      accepted: ['bat "$(rg --files-with-matches TODO docs | fzf)"']
    explanation: |-
      rg -l fournit des chemins. La substitution récupère le
      choix. Les guillemets préservent les espaces du chemin.
      L’annulation n’est pas traitée par cette commande.
  - id: "rg-in-single-log"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "beginner"
    tools: ["rg"]
    prompt: |-
      Avec ripgrep, affiche les lignes contenant timeout dans api.log
      uniquement.
    answer:
      primary: "rg timeout api.log"
      accepted: ["rg 'timeout' api.log"]
    explanation: |-
      Le chemin explicite limite la recherche de contenu à ce
      fichier.
  - id: "rg-scope-one-subtree"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "beginner"
    tools: ["rg"]
    prompt: |-
      Avec ripgrep, cherche migrated dans les fichiers normalement
      parcourus sous db/migrations uniquement.
    answer:
      primary: "rg migrated db/migrations"
    explanation: |-
      Un répertoire en argument fixe le point de départ de la
      recherche récursive.
  - id: "rg-case-insensitive-query"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "beginner"
    tools: ["rg"]
    prompt: |-
      Avec ripgrep, trouve warning dans daemon.log quelle que soit la
      casse utilisée dans le journal.
    answer:
      primary: "rg -i warning daemon.log"
      accepted: ["rg --ignore-case warning daemon.log"]
    explanation: |-
      -i désactive la distinction de casse pour le motif.
  - id: "rg-count-lines-per-file"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "beginner"
    tools: ["rg"]
    prompt: |-
      Avec ripgrep, affiche par fichier le nombre de lignes qui
      contiennent retry sous logs. Une ligne qui répète le mot ne compte
      qu’une fois.
    answer:
      primary: "rg -c retry logs"
      accepted: ["rg --count retry logs"]
    explanation: |-
      -c compte les lignes correspondantes. --count-matches
      compterait les occurrences.
  - id: "rg-invert-health-lines"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "beginner"
    tools: ["rg"]
    prompt: |-
      Avec ripgrep, affiche les lignes de access.log qui ne contiennent
      pas /health.
    answer:
      primary: "rg -v /health access.log"
      accepted: ["rg --invert-match /health access.log"]
    explanation: |-
      -v retient les lignes qui ne correspondent pas au motif.
  - id: "rg-context-line-marker"
    type: "concept"
    exercise_type: "multiple-choice"
    difficulty: "beginner"
    tools: ["rg"]
    prompt: |-
      Pour un seul fichier sans en-tête, rg -n -C 1 erreur journal.log
      affiche « 8-démarrage », « 9:erreur » puis « 10-arrêt ». Quelle
      ligne correspond au motif ?
    choices:
      - "La ligne 8."
      - "La ligne 9."
      - "La ligne 10."
    answer:
      primary: "La ligne 9."
    explanation: |-
      Avec ces options, : marque une correspondance et - marque
      une ligne de contexte.
  - id: "fd-regex-prefix-name"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "beginner"
    tools: ["fd"]
    prompt: |-
      Avec fd, cherche les fichiers dont le nom commence par backup.
      archive-backup.sql doit rester hors des résultats.
    answer:
      primary: "fd -t f '^backup'"
    explanation: |-
      Dans la regex, ^ ancre backup au début du nom. Le type f
      garde les fichiers ordinaires.
  - id: "fzf-filter-no-interaction"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "beginner"
    tools: ["fzf"]
    prompt: |-
      Une liste de services arrive sur stdin. Avec fzf, affiche seulement
      les lignes qui correspondent au motif api, sans ouvrir le sélecteur
      interactif.
    answer:
      primary: "fzf --filter api"
      accepted: ["fzf -f api"]
    explanation: |-
      --filter écrit les lignes correspondantes en mode non
      interactif.
  - id: "rg-explicit-exclusion-last"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "intermediate"
    tools: ["rg"]
    prompt: |-
      Avec ripgrep, cherche TOKEN dans les fichiers .env sous configs,
      sauf ceux dont le nom se termine par .sample.env. configs ne
      contient que des fichiers visibles.
    answer:
      primary: "rg -g '*.env' -g '!*.sample.env' TOKEN configs"
    explanation: |-
      Le dernier glob correspondant prime. Place l’exclusion
      après la sélection générale.
  - id: "rg-reinclude-only-audit-log"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "advanced"
    tools: ["rg"]
    prompt: |-
      Dans un dépôt, .gitignore exclut *.log. Recherche WARN seulement
      dans les fichiers nommés audit.log sous exports avec ripgrep. Le
      dossier exports lui-même est visible.
    answer:
      primary: "rg -g audit.log WARN exports"
    explanation: |-
      Un glob d’inclusion explicite peut réintégrer ce nom ignoré
      et restreindre la recherche au même nom.
  - id: "rg-nested-repo-ignore-vcs"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "advanced"
    tools: ["rg"]
    prompt: |-
      Depuis la racine du dépôt Git imbriqué vendor/client, cherche FIXME
      sous src. Ignore les règles .gitignore mais conserve les règles du
      fichier .ignore qui exclut les fichiers générés.
    answer:
      primary: "rg --no-ignore-vcs FIXME src"
    explanation: |-
      --no-ignore-vcs désactive les exclusions du contrôle de
      version tout en conservant .ignore.
  - id: "fd-fzf-preserve-file-nul-stream"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "advanced"
    tools: ["fd","fzf"]
    prompt: |-
      Sélectionne avec fzf un fichier sous imports. Ses noms peuvent
      contenir des retours à la ligne. Rends le résultat avec le même
      séparateur sûr pour le prochain outil.
    answer:
      primary: "fd -t f -0 . imports | fzf --read0 --print0"
      accepted: ["fd -t f --print0 . imports | fzf --read0 --print0"]
    explanation: |-
      Les deux frontières utilisent NUL. Un retour à la ligne
      dans le nom reste un caractère du chemin.
  - id: "fzf-guard-empty-selection"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "advanced"
    tools: ["fzf"]
    prompt: |-
      Une liste de chemins sans ligne vide ni retour à la ligne dans les
      noms arrive sur stdin. Dans Bash, sélectionne un fichier avec fzf et
      ouvre-le avec less seulement si la sélection réussit.
    answer:
      primary: "choix=$(fzf) && less -- \"$choix\""
    explanation: |-
      L’affectation reprend le statut de la sélection. && bloque
      l’ouverture en cas d’échec et les guillemets préservent les
      espaces.
  - id: "fzf-multi-space-safe"
    type: "concept"
    exercise_type: "multiple-choice"
    difficulty: "advanced"
    tools: ["fzf"]
    prompt: |-
      Dans Bash, des chemins contenant espaces et retours à la ligne
      passent par une sélection multiple de fzf. L’entrée et la sortie
      sont délimitées par NUL. Comment donner chaque chemin séparément à
      une commande ?
    choices:
      - "Lire les résultats séparés par espaces."
      - "Mettre toute la sélection dans un seul argument."
      - "Lire chaque résultat NUL et citer la variable de chemin."
    answer:
      primary: "Lire chaque résultat NUL et citer la variable de chemin."
    explanation: |-
      Utilise --multi --read0 --print0 avec une entrée NUL.
      Lis chaque résultat avec IFS= read -r -d '', puis cite
      la variable pour la transmettre comme un seul argument.
  - id: "rg-binary-nul-diagnostic"
    type: "concept"
    exercise_type: "multiple-choice"
    difficulty: "advanced"
    tools: ["rg"]
    prompt: |-
      Un relevé confirme que capture.dat contient un octet NUL avant le
      motif recherché. En parcours récursif, ripgrep l’a ignoré. Quelle
      option force son traitement comme texte ?
    choices:
      - "--text"
      - "--hidden"
      - "--no-ignore-vcs"
    answer:
      primary: "--text"
    explanation: |-
      La détection du binaire repose sur NUL. --text désactive
      cette détection, avec un risque d’octets de contrôle à
      l’affichage.
  - id: "rg-exit-error-versus-no-match"
    type: "concept"
    exercise_type: "multiple-choice"
    difficulty: "advanced"
    tools: ["rg"]
    prompt: |-
      ripgrep renvoie 2 après avoir signalé qu’un fichier est illisible.
      Pourquoi ne faut-il pas conclure « aucun résultat » ?
    choices:
      - "Le statut 2 indique zéro correspondance sans erreur."
      - "Le statut 2 indique que tous les fichiers correspondent."
      - "Le statut 2 indique une erreur de recherche."
    answer:
      primary: "Le statut 2 indique une erreur de recherche."
    explanation: |-
      1 signifie aucune correspondance en l’absence d’erreur. 2
      signale une erreur et peut accompagner des résultats
      partiels.
  - id: "rg-match-across-lines"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "advanced"
    tools: ["rg"]
    prompt: |-
      Dans trace.log, repère BEGIN suivi immédiatement d’un saut de ligne
      puis de END. Utilise une seule recherche ripgrep capable de
      traverser la coupure.
    answer:
      primary: "rg -U 'BEGIN\\nEND' trace.log"
      accepted: ["rg --multiline 'BEGIN\\nEND' trace.log"]
    explanation: |-
      -U autorise une correspondance qui traverse une ligne. La
      regex \n fixe la coupure recherchée.
  - id: "rg-structured-match-stream"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "advanced"
    tools: ["rg"]
    prompt: |-
      Des chemins et contenus peuvent contenir le caractère deux-points.
      Émets les résultats ripgrep pour token sous imports au format JSON
      ligne par ligne, avec les données de match.
    answer:
      primary: "rg --json token imports"
    explanation: |-
      Les messages JSON séparent chemin, position et contenu. Il
      faut lire leurs champs plutôt que découper une ligne sur
      deux-points.
