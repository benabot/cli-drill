id: "06-recherche-fichiers-contenu"
title: "Rechercher et sélectionner"
description: "Outils tiers fd, ripgrep et fzf. Recherche limitée aux fichiers textuels ordinaires du projet simulé ; les exclusions par défaut sont précisées."
family: "modern-cli-macos"
learning_order: "independent"
items:
  - id: "rg-content"
    type: "tool"
    exercise_type: "multiple-choice"
    difficulty: "beginner"
    tools: ["rg"]
    prompt: |-
      Tu connais le texte TODO mais pas le fichier qui le contient. Quel
      outil de cette liste recherche dans le contenu des fichiers ?
    choices: ["fd", "rg", "eza", "bat"]
    answer:
      primary: "rg"
      accepted: ["ripgrep"]
    explanation: |-
      rg (ripgrep) recherche un motif dans les fichiers. Sans
      chemin explicite, il parcourt le dossier courant ; il ignore
      par défaut les fichiers cachés, exclus et binaires.
  - id: "fd-notes-command"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "beginner"
    tools: ["fd"]
    prompt: |-
      Recherche dans le projet les chemins dont le nom contient notes
      avec l’outil tiers de recherche par nom.
    answer:
      primary: "fd notes"
    explanation: |-
      fd applique par défaut son motif au nom de chaque chemin,
      pas à son contenu. Le motif est une expression régulière ;
      notes ne nécessite ici aucun caractère spécial.
  - id: "fd-fzf-md"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "intermediate"
    tools: ["fd", "fzf"]
    prompt: |-
      Les seules entrées .md du projet sont des fichiers, sans saut de
      ligne dans leurs noms. Filtre les chemins par extension, puis
      choisis-en un interactivement dans le même pipeline.
    answer:
      primary: "fd -e md | fzf"
    explanation: |-
      -e md filtre par extension, sans le point. Le pipe transmet
      les chemins à fzf ; choisir un résultat ne le lit pas et ne
      lance aucun éditeur.
  - id: "rg-fzf-todo"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "intermediate"
    tools: ["rg", "fzf"]
    prompt: |-
      Trouve les lignes du projet contenant TODO en majuscules, puis
      sélectionne une ligne interactivement dans le même pipeline.
    answer:
      primary: "rg TODO | fzf"
      accepted: ["rg \"TODO\" | fzf"]
    explanation: |-
      rg cherche le motif TODO en respectant ici la casse. fzf
      filtre ses lignes de sortie ; celles-ci peuvent inclure
      chemin et numéro de ligne. Ce pipeline n’ouvre aucun
      fichier.
  - id: "rg-fzf-docs"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "intermediate"
    tools: ["rg", "fzf"]
    prompt: |-
      Cherche cli-drill dans les fichiers texte de docs et sélectionne
      une ligne interactivement dans le même pipeline.
    answer:
      primary: "rg cli-drill docs | fzf"
      accepted: ["rg \"cli-drill\" docs | fzf"]
    explanation: |-
      docs borne la recherche de rg à ce dossier. fzf affiche la
      ligne sélectionnée, avec le chemin fourni par la recherche.
  - id: "rg-numbered"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "intermediate"
    tools: ["rg"]
    prompt: |-
      Avec ripgrep, cherche TODO dans docs et affiche le numéro
      de chaque ligne correspondante, même en sortie redirigée.
    answer:
      primary: "rg -n TODO docs"
      accepted: ["rg --line-number TODO docs"]
    explanation: |-
      -n ajoute le numéro de ligne aux résultats. Les fichiers
      cachés ou ignorés restent exclus par défaut.
  - id: "rg-matching-files"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "intermediate"
    tools: ["rg"]
    prompt: |-
      Avec ripgrep, affiche seulement les chemins des fichiers de
      docs contenant TODO, sans afficher leurs lignes.
    answer:
      primary: "rg -l TODO docs"
      accepted: ["rg --files-with-matches TODO docs"]
    explanation: |-
      -l affiche une fois chaque chemin contenant une
      correspondance, sans imprimer le contenu trouvé.
  - id: "rg-fixed-dot"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "intermediate"
    tools: ["rg"]
    prompt: |-
      Avec ripgrep, cherche la chaîne littérale v1.2 dans
      notes.txt, sans interpréter le point comme un motif.
    answer:
      primary: "rg -F 'v1.2' notes.txt"
      accepted: ['rg -F "v1.2" notes.txt', "rg -F v1.2 notes.txt"]
    explanation: |-
      -F traite le motif comme du texte littéral. Sans cette
      option, le point représente un caractère quelconque.
  - id: "rg-go-glob"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "intermediate"
    tools: ["rg"]
    prompt: |-
      Avec ripgrep, cherche TODO dans les fichiers du projet
      dont le nom se termine par .go.
    answer:
      primary: "rg -g '*.go' TODO"
      accepted: ['rg -g "*.go" TODO', "rg --glob '*.go' TODO"]
    explanation: |-
      -g filtre les chemins avec un glob. Les guillemets
      empêchent le shell de développer le motif avant rg.
  - id: "fd-go-files"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "intermediate"
    tools: ["fd"]
    prompt: |-
      Avec fd, trouve les fichiers ordinaires du projet ayant
      l’extension go, sans inclure les dossiers.
    answer:
      primary: "fd -t f -e go"
      accepted: ["fd --type f --extension go"]
    explanation: |-
      -t f restreint aux fichiers et -e go filtre l’extension.
      Les chemins cachés et ignorés restent exclus par défaut.
  - id: "fd-hidden-notes"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "intermediate"
    tools: ["fd"]
    prompt: |-
      Avec fd, trouve les fichiers dont le nom contient notes,
      y compris les cachés, en respectant les exclusions.
    answer:
      primary: "fd -H -t f notes"
      accepted: ["fd --hidden --type f notes"]
    explanation: |-
      -H inclut les chemins cachés et -t f limite aux fichiers.
      Les règles d’exclusion restent appliquées.
  - id: "rg-files-select"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "advanced"
    tools: ["rg", "fzf", "bat"]
    prompt: |-
      Choisis un fichier de docs contenant TODO et affiche-le avec
      bat en une commande. La sélection est confirmée. Les chemins
      peuvent contenir des espaces, sans tiret initial ni saut de ligne.
    answer:
      primary: 'bat "$(rg -l TODO docs | fzf)"'
      accepted: ['bat "$(rg --files-with-matches TODO docs | fzf)"']
    explanation: |-
      rg -l fournit des chemins. La substitution récupère le
      choix. Les guillemets préservent les espaces du chemin.
      L’annulation n’est pas traitée par cette commande.
