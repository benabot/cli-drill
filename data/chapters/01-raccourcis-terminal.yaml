id: "01-raccourcis-terminal"
title: "Raccourcis ZSH — mode Emacs"
description: "Référence : ZSH/ZLE, keymap Emacs standard, sans personnalisation. CLI-Drill capture la touche, sans appliquer son effet à une vraie ligne shell. Une touche interceptée par le terminal ne peut pas être créditée comme capturée."
family: "keyboard-shortcuts"
learning_order: "independent"
items:
  - id: "ctrl-a"
    type: "shortcut"
    exercise_type: "key-sequence"
    difficulty: "beginner"
    tools: []
    prompt: |-
      ZSH/ZLE, mode Emacs standard : appuie sur le raccourci pour revenir au
      début de la ligne courante.
    answer:
      primary: "Ctrl+A"
      accepted: ["^A", "control-a", "ctrl a"]
    explanation: |-
      beginning-of-line place le curseur au début de la ligne
      courante.
  - id: "ctrl-e"
    type: "shortcut"
    exercise_type: "key-sequence"
    difficulty: "beginner"
    tools: []
    prompt: |-
      ZSH/ZLE, mode Emacs standard : appuie sur le raccourci pour rejoindre
      la fin de la ligne courante.
    answer:
      primary: "Ctrl+E"
      accepted: ["^E", "control-e", "ctrl e"]
    explanation: |-
      end-of-line place le curseur à la fin de la ligne courante.
  - id: "ctrl-u-whole-line"
    type: "shortcut"
    exercise_type: "key-sequence"
    difficulty: "beginner"
    tools: []
    prompt: |-
      ZSH/ZLE, mode Emacs standard : appuie sur le raccourci pour couper
      toute la ligne courante, y compris le texte après le curseur.
    answer:
      primary: "Ctrl+U"
      accepted: ["^U", "control-u", "ctrl u"]
    explanation: |-
      kill-whole-line coupe la ligne courante entière ; ce binding
      ZLE ne se limite pas au texte avant le curseur.
  - id: "ctrl-k"
    type: "shortcut"
    exercise_type: "key-sequence"
    difficulty: "beginner"
    tools: []
    prompt: |-
      ZSH/ZLE, mode Emacs standard : appuie sur le raccourci pour couper le
      texte du curseur jusqu’à la fin de la ligne.
    answer:
      primary: "Ctrl+K"
      accepted: ["^K", "control-k", "ctrl k"]
    explanation: |-
      kill-line coupe du curseur à la fin de la ligne ; en fin de
      ligne, il peut aussi couper le saut de ligne suivant.
  - id: "ctrl-w"
    type: "shortcut"
    exercise_type: "key-sequence"
    difficulty: "beginner"
    tools: []
    prompt: |-
      ZSH/ZLE, mode Emacs standard : appuie sur le raccourci pour couper le
      mot précédant le curseur.
    answer:
      primary: "Ctrl+W"
      accepted: ["^W", "control-w", "ctrl w"]
    explanation: |-
      backward-kill-word coupe le mot précédent selon la
      définition des mots de ZLE ; des personnalisations peuvent
      changer ses limites.
  - id: "ctrl-y"
    type: "shortcut"
    exercise_type: "key-sequence"
    difficulty: "beginner"
    tools: []
    prompt: |-
      ZSH/ZLE, mode Emacs standard : appuie sur le raccourci pour réinsérer
      le dernier texte coupé dans le tampon de ZLE.
    answer:
      primary: "Ctrl+Y"
      accepted: ["^Y", "control-y", "ctrl y"]
    explanation: |-
      yank réinsère le texte du kill ring de ZLE. Ce tampon n’est
      pas le presse-papiers système.
  - id: "ctrl-r"
    type: "shortcut"
    exercise_type: "key-sequence"
    difficulty: "beginner"
    tools: []
    prompt: |-
      ZSH/ZLE, mode Emacs standard : appuie sur le raccourci pour démarrer
      la recherche incrémentale vers l’arrière dans l’historique.
    answer:
      primary: "Ctrl+R"
      accepted: ["^R", "control-r", "ctrl r"]
    explanation: |-
      history-incremental-search-backward cherche dans
      l’historique. Une intégration Atuin peut redéfinir Ctrl+R ;
      ici le binding ZLE standard est visé.
  - id: "ctrl-l"
    type: "shortcut"
    exercise_type: "key-sequence"
    difficulty: "beginner"
    tools: []
    prompt: |-
      ZSH/ZLE, mode Emacs standard : appuie sur le raccourci pour rafraîchir
      l’écran et réafficher la ligne en cours.
    answer:
      primary: "Ctrl+L"
      accepted: ["^L", "control-l", "ctrl l"]
    explanation: |-
      clear-screen efface l’affichage puis redessine la ligne.
      Cela ne supprime ni les fichiers ni l’historique ; le
      scrollback dépend du terminal.
