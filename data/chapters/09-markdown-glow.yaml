id: "09-markdown-glow"
title: "Lire du Markdown avec Glow"
description: "Module tiers Glow : fichiers Markdown locaux simulés. Le dernier scénario combine fd, fzf et Glow sous ZSH ou un shell de type POSIX ; il est plus avancé."
family: "modern-cli-macos"
learning_order: "independent"
items:
  - id: "glow-readme"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "beginner"
    tools: ["glow"]
    prompt: |-
      Situation indépendante : README.md est un Markdown du répertoire
      courant. Affiche son rendu dans le terminal avec glow, sans option.
    answer:
      primary: "glow README.md"
    explanation: |-
      glow rend le Markdown dans le terminal à partir du fichier
      indiqué. Le fichier n’est pas modifié ; aucune application
      graphique n’est nécessaire.
  - id: "markdown-select-preview"
    type: "workflow"
    exercise_type: "simple-shell-sim"
    difficulty: "advanced"
    tools: ["fd", "fzf", "glow"]
    prompt: |-
      Situation simulée : fd -e md fournit seulement des fichiers Markdown :
      leurs chemins ne commencent pas par un tiret et ne contiennent aucun
      retour à la ligne, mais certains ont des espaces. fzf renvoie
      exactement un chemin choisi non vide. En une commande, rends ce
      fichier avec glow et une substitution de commande protégée par des
      guillemets.
    answer:
      primary: "glow \"$(fd -e md | fzf)\""
    explanation: |-
      $(...) récupère le chemin choisi ; les guillemets le
      conservent comme un argument même avec des espaces.
      Précondition : une sélection est validée ; l’annulation et
      les noms contenant des retours à la ligne ne sont pas gérés
      par cette commande.
